<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="index.html">The Greek <span class="logo-mark">Geek</span> <span aria-hidden="true">✦</span></a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation">☰</button>
      <nav class="site-nav" id="site-nav" aria-label="Main navigation">
        <ul>

        <p class="post-card__date reveal" id="article-date"></p>
        <h1 class="flourish reveal" id="article-title">Loading entry…</h1>
      </div>
      <div class="article-body reveal">
        <div class="parchment-panel ornate">

        <p style="text-align:center;margin-top:2.2rem;">

  <footer class="site-footer">

  <script src="js/data/recipes.js"></script>
  <script src="js/data/posts.js"></script>
  <script src="js/favourites.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      "use strict";
      const slug = new URLSearchParams(location.search).get("slug");
      const post = slug ? window.DiaryData.getPostBySlug(slug) : null;
      if (!post) {
        location.replace("404.html");
        return;
      }
      document.title = post.title + " | The Greek Geek";
      document.getElementById("article-date").textContent =
        window.GG.formatDate(post.publishedAt) + " · " + post.readMinutes + " min read";
      document.getElementById("article-title").textContent = post.title;
      document.getElementById("article-content").innerHTML =
        post.body.map((p) => "<p>" + window.GG.escapeHtml(p) + "</p>").join("");
    })();
  </script>
</body>
